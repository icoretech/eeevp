  <title id="eeevp-icon-title">EEEVP</title>
  <rect width="24" height="24" rx="6" fill="#f8f7f4"/>
  <rect x="0.75" y="0.75" width="22.5" height="22.5" rx="5.25" fill="#283e33"/>
  <g fill="#f8f7f4">
    <rect x="5" y="7" width="3" height="10" rx="0.75"/>
    <rect x="10.5" y="4" width="3" height="16" rx="0.75"/>
