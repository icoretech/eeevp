name: eeevp-synteq
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "yarn install --immutable && yarn dev"
    ports:
      - "127.0.0.1:3000:3000"
      - "[::1]:3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next:/app/.next
      - video_data:/app/data
    env_file: .env.development
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    init: true
volumes:
  node_modules:
  next:
  video_data:
